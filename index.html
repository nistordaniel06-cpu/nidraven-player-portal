<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDRAVEN · Founder V5.1</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#eae2d6;font:15px system-ui}header{padding:20px;color:#dfb97d;border-bottom:1px solid #53432f;font:24px Georgia}main{padding:28px 5% 110px;max-width:960px;margin:auto}h1,h2{color:#e3bd81;font-family:Georgia}.card{background:#191920;border:1px solid #504034;border-radius:16px;padding:22px;margin:15px 0}.hidden{display:none!important}.muted{color:#ada59c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:20px;background:#28232b;border-radius:12px}.stat b{display:block;font-size:30px;color:#dfb97d}input,select{width:100%;display:block;background:#0d0d12;border:1px solid #67523b;border-radius:9px;padding:13px;color:white;margin:10px 0}button{background:#782f25;color:white;border:1px solid #ad8455;border-radius:9px;padding:12px;margin:5px;cursor:pointer}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#15151d;border-top:1px solid #55432d;padding:10px}.tabs button{background:#28222a}.player{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #55432d;overflow-wrap:anywhere}.status{color:#e3bd81}</style><header>NIDRAVEN <small style="float:right;font:11px system-ui">V5.1 ALPHA</small></header><main><h1 id="title">Player Portal</h1><section id="auth" class="card"><h2>Enter the Realm</h2><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="8" required><button>Login</button><button type="button" id="signup">Create Account</button><button type="button" id="reset">Reset Password</button></form><p id="authmsg" class="status"></p></section><section id="app" class="hidden"><section id="home"><div class="card"><h2 id="welcome">Welcome</h2><p id="identity" class="muted"></p><p id="role"></p><button id="logout">Log Out</button></div><div id="founderHome" class="hidden"><div class="grid"><div class="stat"><b id="total">—</b>Players</div><div class="stat"><b id="staff">—</b>Staff</div></div><div class="card"><h2>👑 Founder Command Center</h2><button id="quickPlayers">Manage Players</button><button id="quickGM">GM Center</button></div></div></section><section id="playersPage" class="card hidden"><h2>Players</h2><input id="search" placeholder="Search by name or UUID"><button id="reload">Refresh</button><p id="listmsg" class="status"></p><div id="players"></div></section><section id="gmPage" class="card hidden"><h2>GM Center</h2><p id="selected" class="muted">Select a player from Players</p><input id="target" placeholder="Player UUID"><select id="newrole"><option value="player">Player / revoke staff</option><option value="moderator">Moderator</option><option value="game_master">Game Master</option><option value="head_gm">Head GM</option><option value="administrator">Administrator</option></select><button id="assign">Update Rank</button><p id="staffmsg" class="status"></p></section><section id="settingsPage" class="card hidden"><h2>Settings</h2><input id="display" maxlength="32" placeholder="Display name"><button id="save">Save Profile</button><p id="profilemsg" class="status"></p><p class="muted">Game server is not connected yet.</p></section><nav class="tabs"><button data-page="home">⌂ Home</button><button data-page="playersPage" class="founderTab hidden">♙ Players</button><button data-page="gmPage" class="founderTab hidden">⚔ GM</button><button data-page="settingsPage">⚙ Settings</button></nav></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.76.1';const s=createClient('https://ddhilzlkxmsgmggftwmy.supabase.co','sb_publishable_EmhVHm4gBePLkGqEzYX56w_vy2WjhpY');const $=id=>document.getElementById(id);let user=null,founder=false,players=[];const msg=(id,t)=>$(id).textContent=t;function page(id){if(['gmPage','playersPage'].includes(id)&&!founder)return;['home','gmPage','playersPage','settingsPage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('title').textContent=({home:'Command Center',gmPage:'GM Center',playersPage:'Players',settingsPage:'Settings'})[id]}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('quickPlayers').onclick=()=>page('playersPage');$('quickGM').onclick=()=>page('gmPage');async function load(){if(!founder)return;const[{data:p,error:e},{data:r,error:f}]=await Promise.all([s.from('nidraven_profiles').select('user_id,display_name').limit(200),s.from('nidraven_roles').select('user_id,role').limit(200)]);if(e||f)return msg('listmsg',(e||f).message);const ranks=new Map((r||[]).map(x=>[x.user_id,x.role]));players=(p||[]).map(x=>({...x,role:ranks.get(x.user_id)||'player'}));$('total').textContent=players.length;$('staff').textContent=players.filter(x=>x.role!=='player').length;msg('listmsg',players.length+' profiles loaded');draw()}function draw(){$('players').replaceChildren();for(const p of players.filter(x=>(x.display_name+x.user_id).toLowerCase().includes($('search').value.toLowerCase()))){const d=document.createElement('div');d.className='player';const n=document.createElement('span');n.textContent=p.display_name+' · '+p.role;const b=document.createElement('button');b.textContent='Select';b.onclick=()=>{$('target').value=p.user_id;$('selected').textContent=p.display_name+' · '+p.user_id;page('gmPage')};d.append(n,b);$('players').append(d)}}async function refresh(){const{data:{user:u}}=await s.auth.getUser();user=u;$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(!u){$('title').textContent='Player Portal';return}const[{data:p},{data:r}]=await Promise.all([s.from('nidraven_profiles').select('display_name').eq('user_id',u.id).maybeSingle(),s.from('nidraven_roles').select('role').eq('user_id',u.id).maybeSingle()]);founder=r?.role==='founder';$('welcome').textContent='Welcome, '+(p?.display_name||'Adventurer');$('identity').textContent=u.email;$('role').textContent='Role: '+(r?.role||'player');$('display').value=p?.display_name||'Adventurer';$('founderHome').classList.toggle('hidden',!founder);document.querySelectorAll('.founderTab').forEach(x=>x.classList.toggle('hidden',!founder));page('home');if(founder)await load()}$('login').onsubmit=async e=>{e.preventDefault();const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});msg('authmsg',error?error.message:'Signed in');if(!error)await refresh()};$('signup').onclick=async()=>{const{error}=await s.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin}});msg('authmsg',error?error.message:'Check your email')};$('reset').onclick=async()=>{const{error}=await s.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin});msg('authmsg',error?error.message:'Check your email')};$('logout').onclick=async()=>{await s.auth.signOut();await refresh()};$('save').onclick=async()=>{const display_name=$('display').value.trim();if(display_name.length<2)return msg('profilemsg','Name too short');const{error}=await s.from('nidraven_profiles').upsert({user_id:user.id,display_name},{onConflict:'user_id'});msg('profilemsg',error?error.message:'Saved');if(!error)await refresh()};$('search').oninput=draw;$('reload').onclick=load;$('assign').onclick=async()=>{if(!founder)return;const target_user=$('target').value.trim();if(!/^[0-9a-f-]{36}$/i.test(target_user))return msg('staffmsg','Invalid UUID');if(!confirm('Change role?'))return;const{error}=await s.rpc('nidraven_set_staff_role',{target_user,new_role:$('newrole').value});msg('staffmsg',error?error.message:'Role updated');if(!error)await load()};s.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></html>
